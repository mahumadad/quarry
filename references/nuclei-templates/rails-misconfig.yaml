id: rails-development-info-exposed
info:
  name: Rails Development Information Pages Exposed
  author: pentest-plugin
  severity: medium
  description: Detects Rails development information pages with framework-specific content.
  tags: rails,ruby,debug,info-disclosure
  metadata:
    reviewed: true
    risk: safe
    auth: none
    stacks: rails,ruby
    protocols: http
    architectures: monolith
    coverage: debug-exposure,info-disclosure
    fixture: rails-info
    max-request: 4
http:
  - method: GET
    path:
      - "{{BaseURL}}/rails/info/properties"
      - "{{BaseURL}}/rails/info/routes"
      - "{{BaseURL}}/rails/info"
      - "{{BaseURL}}/rails/mailers"
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["Rails version", "Routes match in priority", "Action Mailer"]
        condition: or
      - type: word
        part: body
        words: ["Ruby version", "Application root", "Prefix Verb", "rails/info"]
        condition: or
