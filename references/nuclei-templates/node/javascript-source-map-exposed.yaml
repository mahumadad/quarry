id: javascript-source-map-content-exposed
info:
  name: JavaScript Source Map With Source Content Exposed
  author: quarry
  severity: low
  description: Detects source maps containing original source content on fixed bundle paths.
  tags: nodejs,nextjs,nuxtjs,source-map,info-disclosure
  metadata:
    reviewed: true
    risk: safe
    stacks: nodejs,nextjs,nuxtjs,react,vue,angular
    protocols: http
    architectures: spa,ssr
    coverage: source-disclosure,client-recon
    fixture: source-map
    max-request: 5
http:
  - method: GET
    path: ["{{BaseURL}}/main.js.map", "{{BaseURL}}/app.js.map", "{{BaseURL}}/bundle.js.map", "{{BaseURL}}/static/js/main.chunk.js.map", "{{BaseURL}}/_nuxt/app.js.map"]
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ['"sourcesContent"', '"mappings"']
        condition: and
      - type: word
        part: body
        words: ['"sources"', '"names"']
        condition: and
