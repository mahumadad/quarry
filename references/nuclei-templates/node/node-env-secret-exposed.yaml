id: node-environment-secret-exposed
info:
  name: Node Environment Secret File Exposed
  author: quarry
  severity: high
  description: Detects concrete secret assignments in public Node environment and configuration files.
  tags: nodejs,express,nestjs,secret-exposure
  metadata:
    reviewed: true
    risk: safe
    stacks: nodejs,express,nestjs,nextjs,nuxtjs
    protocols: http
    coverage: secret-exposure,configuration-exposure
    fixture: node-env
    max-request: 6
http:
  - method: GET
    path: ["{{BaseURL}}/.env", "{{BaseURL}}/.env.local", "{{BaseURL}}/.env.production", "{{BaseURL}}/config/default.json", "{{BaseURL}}/config/production.json", "{{BaseURL}}/config.json"]
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - "(?i)(DB_PASSWORD|DATABASE_URL|JWT_SECRET|SESSION_SECRET|REDIS_URL|MONGO_URI|API_SECRET)[\"']?\\s*[:=]\\s*\\S{8,}"
        condition: or
