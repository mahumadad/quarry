id: magento-api-exposed

info:
  name: Magento REST API Accessible Without Authentication
  author: pentest-plugin
  severity: medium
  description: |
    Detecta endpoints de la REST API de Magento accesibles sin autenticación.
    Estos endpoints exponen configuración de la tienda, países, monedas y
    potencialmente catálogo de productos con precios.
  tags: magento,api,exposure,ecommerce,rest
  reference:
    - https://developer.adobe.com/commerce/webapi/rest/
  metadata:
    verified: true
    max-request: 4

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/V1/store/storeConfigs"
      - "{{BaseURL}}/rest/V1/directory/countries"
      - "{{BaseURL}}/rest/V1/directory/currency"
      - "{{BaseURL}}/rest/V1/store/websites"

    stop-at-first-match: false

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      - type: regex
        part: body
        regex:
          - '"id"\s*:\s*\d+'
          - '"code"\s*:\s*"'
        condition: or

    extractors:
      - type: json
        part: body
        json:
          - '.[0].base_url'
          - '.[0].locale'
          - '.[0].base_currency_code'
