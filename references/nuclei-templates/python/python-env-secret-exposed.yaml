id: python-environment-secret-exposed
info:
  name: Python Environment Secret File Exposed
  author: pentest-plugin
  severity: high
  description: Detects concrete secret assignments in environment or Python configuration files.
  tags: python,django,flask,fastapi,secret-exposure
  metadata:
    reviewed: true
    risk: safe
    stacks: python,django,flask,fastapi
    protocols: http
    coverage: secret-exposure,configuration-exposure
    fixture: python-env
    max-request: 5
http:
  - method: GET
    path: ["{{BaseURL}}/.env", "{{BaseURL}}/settings.py", "{{BaseURL}}/config.py", "{{BaseURL}}/.env.production", "{{BaseURL}}/instance/config.py"]
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - "(?m)^\\s*(SECRET_KEY|DATABASE_URL|DJANGO_SECRET_KEY|CELERY_BROKER_URL|SENTRY_DSN)\\s*=\\s*\\S{8,}"
        condition: or
