id: magento-admin-exposed
info:
  name: Magento Admin Login Surface
  author: pentest-plugin
  severity: info
  description: Identifies a Magento admin login surface; public routing alone is not a vulnerability.
  tags: magento,admin,panel,fingerprint,ecommerce
  metadata:
    reviewed: true
    risk: safe
    auth: none
    stacks: magento
    protocols: http
    coverage: attack-surface,admin-panel
    fixture: magento-admin
    max-request: 4
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/admin/dashboard"
      - "{{BaseURL}}/magento_admin"
      - "{{BaseURL}}/backend"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["Magento", "magento"]
        condition: or
      - type: word
        part: body
        words: ["admin__login", "adminhtml", "magento-logo"]
        condition: or
