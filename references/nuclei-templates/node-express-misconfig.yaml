id: node-express-misconfig

info:
  name: Node.js / Express Misconfiguration Detection
  author: pentest-plugin
  severity: medium
  description: |
    Detects common Node.js and Express.js misconfigurations: debug mode,
    exposed stack traces, npm metadata, environment variables, GraphQL
    playground, and common admin/monitoring endpoints.
  tags: nodejs,express,misconfig,framework

http:
  - method: GET
    path:
      # Express debug/dev indicators
      - "{{BaseURL}}/debug"
      - "{{BaseURL}}/__express"
      - "{{BaseURL}}/debug/pprof"

      # Package metadata
      - "{{BaseURL}}/package.json"
      - "{{BaseURL}}/package-lock.json"
      - "{{BaseURL}}/yarn.lock"
      - "{{BaseURL}}/node_modules/.package-lock.json"

      # Environment leaks
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.env.development"
      - "{{BaseURL}}/env"
      - "{{BaseURL}}/config.json"
      - "{{BaseURL}}/config/default.json"
      - "{{BaseURL}}/config/production.json"

      # Source maps
      - "{{BaseURL}}/main.js.map"
      - "{{BaseURL}}/app.js.map"
      - "{{BaseURL}}/bundle.js.map"
      - "{{BaseURL}}/static/js/main.chunk.js.map"

      # GraphQL playground/IDE
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/graphiql"
      - "{{BaseURL}}/playground"
      - "{{BaseURL}}/altair"
      - "{{BaseURL}}/voyager"

      # Monitoring/admin
      - "{{BaseURL}}/metrics"
      - "{{BaseURL}}/prometheus"
      - "{{BaseURL}}/health"
      - "{{BaseURL}}/healthcheck"
      - "{{BaseURL}}/status"
      - "{{BaseURL}}/info"
      - "{{BaseURL}}/bull-board"
      - "{{BaseURL}}/queues"

      # PM2 / process manager
      - "{{BaseURL}}/pm2"
      - "{{BaseURL}}/keymetrics"

    stop-at-first-match: false
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "\"name\":"
          - "\"dependencies\":"
          - "\"devDependencies\":"
          - "\"scripts\":"
        condition: and
        part: body

      - type: word
        words:
          - "DB_PASSWORD"
          - "DATABASE_URL"
          - "JWT_SECRET"
          - "SESSION_SECRET"
          - "REDIS_URL"
          - "MONGO_URI"
          - "API_KEY"
        condition: or
        part: body

      - type: word
        words:
          - "\"mappings\""
          - "\"sources\""
          - "\"sourcesContent\""
        condition: and
        part: body

      - type: word
        words:
          - "GraphQL Playground"
          - "GraphiQL"
          - "__schema"
          - "type Query"
          - "Voyager"
        condition: or
        part: body

      - type: word
        words:
          - "Express"
          - "Cannot GET"
          - "SyntaxError"
          - "ReferenceError"
          - "at Object."
          - "at Module."
        condition: or
        part: body

      - type: word
        words:
          - "stack"
          - "message"
          - "Error"
        condition: and
        part: body
