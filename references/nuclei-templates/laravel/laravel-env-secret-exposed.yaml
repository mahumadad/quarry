id: laravel-environment-secret-exposed
info:
  name: Laravel Environment Secret Exposed
  author: pentest-plugin
  severity: high
  description: Detects concrete Laravel application or database secrets in public environment files.
  tags: php,laravel,secret-exposure
  metadata:
    reviewed: true
    risk: safe
    stacks: php,laravel
    protocols: http
    coverage: secret-exposure,configuration-exposure
    fixture: laravel-env
    max-request: 3
http:
  - method: GET
    path: ["{{BaseURL}}/.env", "{{BaseURL}}/.env.production", "{{BaseURL}}/config/database.php"]
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - "(?m)^\\s*(APP_KEY|DB_PASSWORD|MAIL_PASSWORD|REDIS_PASSWORD)\\s*=\\s*[^\\r\\n\\s]{8,}"
        condition: or
