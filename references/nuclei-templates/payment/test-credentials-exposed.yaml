id: payment-test-credentials-exposed
info:
  name: Payment Test Credentials in Public JavaScript
  author: quarry
  severity: medium
  description: Detects likely test secrets in public bundles; test and live impact must not be conflated.
  tags: payment,stripe,mercadopago,secret-exposure,test-mode
  metadata:
    reviewed: true
    risk: safe
    stacks: payment,fintech
    protocols: http
    architectures: spa,ssr,monolith
    coverage: secret-exposure,payment-security
    fixture: payment-test-secret
    max-request: 6
http:
  - method: GET
    path: ["{{BaseURL}}/static/js/main.js", "{{BaseURL}}/static/js/app.js", "{{BaseURL}}/assets/js/app.js", "{{BaseURL}}/bundle.js", "{{BaseURL}}/dist/main.js", "{{BaseURL}}/build/static/js/main.chunk.js"]
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - "sk_test_[a-zA-Z0-9]{24,}"
          - "TEST-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
        condition: or
