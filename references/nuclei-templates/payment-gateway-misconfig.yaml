id: payment-live-credentials-exposed
info:
  name: Live Payment Credentials in Public JavaScript
  author: quarry
  severity: high
  description: Detects likely live payment secrets in fixed public bundles; redact and validate ownership without using credentials.
  tags: payment,stripe,mercadopago,paypal,secret-exposure
  metadata:
    reviewed: true
    risk: safe
    auth: none
    stacks: payment,fintech
    protocols: http
    architectures: spa,ssr,monolith
    coverage: secret-exposure,payment-security
    fixture: payment-live-secret
    max-request: 6
http:
  - method: GET
    path:
      - "{{BaseURL}}/static/js/main.js"
      - "{{BaseURL}}/static/js/app.js"
      - "{{BaseURL}}/assets/js/app.js"
      - "{{BaseURL}}/bundle.js"
      - "{{BaseURL}}/dist/main.js"
      - "{{BaseURL}}/build/static/js/main.chunk.js"
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - 'sk_live_[a-zA-Z0-9]{24,}'
          - 'APP_USR-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
          - 'PAYPAL_CLIENT_SECRET["\x27]?\s*[:=]\s*["\x27][^"\x27\s]{12,}'
        condition: or
