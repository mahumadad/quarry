id: graphql-field-suggestions
info:
  name: GraphQL Field Suggestions Enabled
  author: quarry
  severity: info
  description: Confirms schema-derived field suggestions in validation errors.
  tags: graphql,enumeration,api,attack-surface
  metadata:
    reviewed: true
    risk: safe
    auth: none
    stacks: graphql
    protocols: http,graphql
    coverage: api-discovery,field-enumeration
    fixture: graphql-suggestions
    max-request: 3
http:
  - method: POST
    path: ["{{BaseURL}}/graphql", "{{BaseURL}}/api/graphql", "{{BaseURL}}/_v/graphql"]
    headers:
      Content-Type: application/json
    body: '{"query":"{__typ}"}'
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200, 400]
      - type: word
        part: body
        words: ["Did you mean", "did you mean"]
        condition: or
      - type: regex
        part: body
        regex: ['"message"\s*:\s*"[^"\r\n]*[Dd]id you mean']
