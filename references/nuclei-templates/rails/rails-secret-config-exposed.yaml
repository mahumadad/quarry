id: rails-secret-config-exposed
info:
  name: Rails Secret Configuration Exposed
  author: quarry
  severity: high
  description: Detects concrete Rails secrets or database credentials in public configuration files.
  tags: rails,ruby,secret-exposure
  metadata:
    reviewed: true
    risk: safe
    stacks: rails,ruby
    protocols: http
    architectures: monolith
    coverage: secret-exposure,configuration-exposure
    fixture: rails-secret
    max-request: 5
http:
  - method: GET
    path: ["{{BaseURL}}/.env", "{{BaseURL}}/config/database.yml", "{{BaseURL}}/config/secrets.yml", "{{BaseURL}}/config/master.key", "{{BaseURL}}/config/credentials.yml"]
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - "(?i)(secret_key_base|SECRET_KEY_BASE|database_password|password)\\s*[:=]\\s*\\S{8,}"
          - '(?m)^[a-f0-9]{32,}$'
        condition: or
