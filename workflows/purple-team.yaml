name: purple-team
description: Joint session with the SOC — replay PoCs while observing live detections

# Requiere: findings ya reportados + SOC del cliente disponible + acceso de
# solo-lectura a su telemetría durante la sesión. Convierte la tabla
# Detection Coverage del reporte (estimada) en realidad observada.

phases:
  - name: session-setup
    gate: human_approval
    notes: >
      - Acordar agenda: qué findings se re-ejecutan (típicamente
        críticos/altos + los más sigilosos)
      - Confirmar acceso del pentester al SIEM/dashboards en modo observador
      - Reglas: replay solo de PoCs ya autorizados, en la ventana acordada
        (timeguard aplica), ventana corta (2-4h típico)

  - name: replay-observe
    skills: [detection-opportunities]
    notes: >
      Por cada finding seleccionado:
      1. SOC silencia su monitoring del target (o anota la hora exacta)
      2. Re-ejecutar el PoC paso a paso, narrando cada acción
      3. SOC observa EN VIVO: ¿qué disparó? ¿dónde? ¿con qué latencia?
      4. Registrar por técnica: detectado / detectado-tarde / no detectado
         + el evento/log exacto que disparó (si hubo)
      Todo queda en custody: es evidencia de la postura defensiva real.

  - name: tune-verify
    notes: >
      Para cada "no detectado": el SOC ajusta/crea la detección (usando la
      idea de detección del finding como punto de partida) y se RE-EJECUTA
      el PoC para verificar que ahora dispara. Ese ciclo detect→tune→verify
      es el entregable central de la sesión.

  - name: session-report
    notes: >
      Actualizar la tabla Detection Coverage del engagement report con la
      columna de realidad observada: qué detecta hoy el cliente, qué quedó
      ciego, qué detecciones nuevas nacieron de la sesión. Este delta es el
      ROI tangible del purple teaming.
