name: purple-team
description: Joint session with the SOC — replay PoCs while observing live detections

# Requires: findings already reported + client SOC available + read-only
# access to their telemetry during the session. Converts the report's
# Detection Coverage table (estimated) into observed reality.

phases:
  - name: session-setup
    gate: human_approval
    notes: >
      - Agree on the agenda: which findings to replay (typically
        critical/high + the stealthiest ones)
      - Confirm pentester access to SIEM/dashboards in observer mode
      - Rules: replay only previously authorized PoCs, within the agreed
        window (timeguard applies), short window (2-4h typical)

  - name: replay-observe
    skills: [detection-opportunities]
    notes: >
      For each selected finding:
      1. SOC silences their target monitoring (or notes the exact time)
      2. Re-execute the PoC step by step, narrating each action
      3. SOC observes LIVE: what fired? where? with what latency?
      4. Record per technique: detected / detected-late / not detected
         + the exact event/log that fired (if any)
      Everything goes into custody: it is evidence of the real defensive posture.

  - name: tune-verify
    notes: >
      For each "not detected": the SOC adjusts/creates the detection (using
      the finding's detection idea as a starting point) and the PoC is
      RE-EXECUTED to verify it now fires. That detect→tune→verify cycle
      is the central deliverable of the session.

  - name: session-report
    notes: >
      Update the engagement report's Detection Coverage table with the
      observed-reality column: what the client detects today, what remained
      blind, what new detections were born from the session. This delta is
      the tangible ROI of purple teaming.
