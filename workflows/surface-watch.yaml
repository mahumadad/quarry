name: surface-watch
description: Continuous surface monitoring between engagements — periodic re-recon with diff and alerts

# Diseñado para correr en schedule (cron). No es hunting: es recon pasivo +
# diff contra el baseline del último engagement. Cambios detectados son
# LEADS para el operador, nunca findings automáticos.

phases:
  - name: passive-recon
    skills: [passive-recon, dns-enumeration, subdomain-discovery, tech-stack-fingerprint]
    budget: 30
    notes: >
      Solo pasivo o de bajo ruido: CT logs, DNS, certificados, fingerprint
      de headers. Sin fuzzing, sin tráfico pesado — corre sin aviso previo
      dentro del scope del engagement original.

  - name: diff
    notes: >
      engine/target_diff.py contra el snapshot anterior:
      - subdominios nuevos (cada uno es superficie no auditada)
      - endpoints/rutas nuevas en assets conocidos
      - cambios de stack/versiones (¿upgrade? ¿downgrade?)
      - servicios/puertos nuevos expuestos
      - certificados nuevos (¿nuevos ambientes? ¿phishing lookalike?)

  - name: alert
    condition: changes_detected
    notes: >
      Si hay cambios relevantes: nota al operador/cliente con el diff y la
      recomendación (¿vale un retest dirigido? ¿esperar al próximo
      engagement?). Si NO hay cambios: log silencioso — no generar ruido.

  - name: baseline-update
    notes: >
      El snapshot nuevo pasa a ser el baseline. Custody event por corrida
      (aunque no haya cambios — el registro de "vigilado sin cambios" tiene
      valor contractual).

# Schedule sugerido: semanal para assets críticos, mensual para el resto.
# Fuera de cron, el comando manual es /quarry:status --watch.
