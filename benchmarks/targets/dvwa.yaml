name: dvwa
image: vulnerables/web-dvwa
port: 80
description: Damn Vulnerable Web Application — clásico PHP, clases básicas, run rápido

# DVWA requiere setup post-arranque (click en "Create/Reset Database") y
# security level configurable — fijar en "low" para baseline reproducible.
expected:
  - id: dvwa-sqli
    vuln_class: sqli
    severity: high
    title: "SQLi en /vulnerabilities/sqli"
    keywords: [sql, sqli]

  - id: dvwa-sqli-blind
    vuln_class: sqli
    severity: high
    title: "Blind SQLi"
    keywords: [blind, sqli, sleep]

  - id: dvwa-xss-reflected
    vuln_class: xss
    severity: medium
    title: "Reflected XSS"
    keywords: [xss, reflected, reflejado]

  - id: dvwa-xss-stored
    vuln_class: xss
    severity: high
    title: "Stored XSS (guestbook)"
    keywords: [stored, xss, guestbook]

  - id: dvwa-cmdi
    vuln_class: rce
    severity: critical
    title: "Command injection en /vulnerabilities/exec"
    keywords: [command, exec, inyección, cmd]

  - id: dvwa-file-upload
    vuln_class: file-upload
    severity: high
    title: "Upload de webshell sin validación"
    keywords: [upload, shell, archivo]

  - id: dvwa-lfi
    vuln_class: lfi-rfi
    severity: high
    title: "File inclusion (LFI)"
    keywords: [include, lfi, traversal]

  - id: dvwa-csrf
    vuln_class: csrf
    severity: medium
    title: "CSRF en cambio de password"
    keywords: [csrf]

  - id: dvwa-brute
    vuln_class: rate-limiting
    severity: low
    title: "Brute force sin lockout en login"
    keywords: [brute, fuerza, lockout]

  # --- Módulos oficiales del repo master no cubiertos por el subset rápido ---
  # (lista verificada contra github.com/digininja/DVWA/contents/vulnerabilities)

  - id: dvwa-xss-dom
    vuln_class: xss
    severity: medium
    title: "DOM XSS en /vulnerabilities/xss_d"
    keywords: [dom, xss, client-side]

  - id: dvwa-weak-session
    vuln_class: session-management
    severity: medium
    title: "Weak session IDs (dvwaSession incremental predecible)"
    keywords: [session, predecible, incremental, weak]

  - id: dvwa-captcha
    vuln_class: auth-bypass
    severity: medium
    title: "Insecure CAPTCHA (bypass por parámetro oculto)"
    keywords: [captcha, bypass]

  - id: dvwa-csp-bypass
    vuln_class: xss
    severity: medium
    title: "CSP bypass (policy con fuente insegura)"
    keywords: [csp, content-security-policy, bypass]
    optional: true   # puede requerir origen externo permitido por la policy

  - id: dvwa-javascript
    vuln_class: business-logic
    severity: low
    title: "JavaScript challenge (token generado en cliente)"
    keywords: [javascript, token, cliente]

  - id: dvwa-open-redirect
    vuln_class: open-redirect
    severity: low
    title: "Open redirect en /vulnerabilities/open_redirect"
    keywords: [redirect, open, location]

  - id: dvwa-authbypass
    vuln_class: auth-bypass
    severity: high
    title: "Authorisation bypass (acceso a función admin como usuario)"
    keywords: [authorisation, authorization, admin, usuario]

  - id: dvwa-bac
    vuln_class: broken-access-control
    severity: high
    title: "Broken access control"
    keywords: [access control, bac, idor, ajeno]

  - id: dvwa-crypto
    vuln_class: info-disclosure
    severity: medium
    title: "Cryptography débil (módulo crypto)"
    keywords: [cryptography, cifrado, decode, xor]

  - id: dvwa-api
    vuln_class: api-abuse
    severity: medium
    title: "API sin autorización robusta"
    keywords: [api, rest, json]

  # --- Hallazgos de plataforma (no son módulos, un pentest real los reporta) ---

  - id: dvwa-default-creds
    vuln_class: auth-bypass
    severity: high
    title: "Credenciales por defecto (admin/password)"
    keywords: [default, credenciales, defecto]

  - id: dvwa-phpinfo
    vuln_class: info-disclosure
    severity: low
    title: "phpinfo expuesto"
    keywords: [phpinfo, versión, exposición]

  - id: dvwa-md5-passwords
    vuln_class: info-disclosure
    severity: medium
    title: "Passwords en MD5 sin salt en la base"
    keywords: [md5, unsalted, rainbow]

  - id: dvwa-cookie-flags
    vuln_class: session-management
    severity: low
    title: "Cookies de sesión sin HttpOnly/Secure/SameSite"
    keywords: [httponly, cookie, samesite, secure flag]

  - id: dvwa-git-exposed
    vuln_class: info-disclosure
    severity: medium
    title: "Repositorio .git expuesto en el docroot"
    keywords: [git, exposed, vcs, repositorio, config]
    optional: true   # artefacto de despliegue (clon git servido directo), no bug de DVWA

  - id: dvwa-cors-wildcard
    vuln_class: cors
    severity: low
    title: "CORS wildcard en el API (ACAO: *)"
    keywords: [cors, wildcard, origin, access-control]
